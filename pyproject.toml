[project]
name = "keyword-serp-dashboard"
version = "0.1.0"
description = "Keyword & SERP Analytics Dashboard"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.109.0",
    "sqlalchemy==2.0.25",
    "asyncpg>=0.29.0",
    "supabase>=2.0.0",
    "pandas==2.1.4",
    "orjson==3.9.12",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "httpx==0.26.0",
    "anthropic==0.43.0",
    "python-dotenv==1.0.0",
]

[project.scripts]
app = "backend.app.main:app"

